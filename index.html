<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bdg · Project Health – Kontakte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  .env-banner {
    position: sticky; top: 0; z-index: 100; text-align: center;
    font-weight: 700; letter-spacing: 1px; font-size: 13px; padding: 8px 12px;
    color: #0b0b0b;
    background: repeating-linear-gradient(-45deg, #C8D400 0 18px, #a8b300 18px 36px);
  }
  :root {
    --bg: #0b0b0b; --panel: #141414; --panel-2: #1c1c1c; --line: #2a2a2a;
    --text: #f2f2f2; --muted: #9a9a9a; --pear: #C8D400; --danger: #e05252; --ok: #7fbf3f;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Roboto', sans-serif; font-size: 15px; line-height: 1.45; }
  a { color: var(--pear); }
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: min(420px, 92vw); border: 1px solid var(--line); background: var(--panel); padding: 36px; }
  .wordmark { font-weight: 700; font-size: 22px; letter-spacing: .5px; }
  .wordmark b { color: var(--pear); }
  .login-card p { color: var(--muted); }
  input, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); padding: 10px 12px; font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--pear); }
  button {
    font: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--pear);
    background: var(--pear); color: #0b0b0b; padding: 10px 16px;
  }
  button.ghost { background: transparent; color: var(--pear); }
  button.quiet { background: transparent; color: var(--muted); border-color: var(--line); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; }
  .stack > * + * { margin-top: 12px; }

  #app { display: none; max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 22px 0 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header.top .who { color: var(--muted); font-size: 13px; }
  header.top .who button { padding: 4px 10px; margin-left: 10px; }
  .langsw { display: inline-flex; margin-left: 12px; border: 1px solid var(--line); }
  .langsw button { padding: 3px 9px; font-size: 12px; background: transparent; color: var(--muted);
    border: none; border-left: 1px solid var(--line); margin: 0; }
  .langsw button:first-child { border-left: none; }
  .langsw button.on { background: var(--pear); color: #0b0b0b; }
  .login-card .langsw { margin: 0 0 4px; }

  .intro { border: 1px solid var(--line); background: var(--panel); margin-top: 18px; }
  .intro summary {
    cursor: pointer; padding: 12px 16px; font-weight: 500; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  .intro summary::-webkit-details-marker { display: none; }
  .intro summary::after { content: '▾'; color: var(--muted); }
  .intro[open] summary::after { content: '▴'; }
  .intro .body { padding: 0 16px 16px; color: var(--muted); font-size: 14px; max-width: 780px; }
  .intro .body b { color: var(--text); font-weight: 500; }
  .intro ol { padding-left: 20px; margin: 10px 0; }
  .intro li { margin-bottom: 6px; }
  .roundbar { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin-top: 16px; flex-wrap: wrap; }
  .roundbar .label { color: var(--muted); font-size: 13px; }
  .roundbar .label b { color: var(--text); font-weight: 500; }
  .coverage { flex: 1; min-width: 240px; }
  .coverage .bar { height: 6px; background: var(--panel-2); position: relative; }
  .coverage .bar i { position: absolute; inset: 0 auto 0 0; background: var(--pear); }
  .coverage .legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .coverage .legend b { color: var(--text); font-weight: 500; }

  nav.steps { display: flex; gap: 0; margin: 22px 0 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav.steps button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 12px 14px; font-weight: 500; display: flex; align-items: center; gap: 8px;
  }
  nav.steps button.active { color: var(--text); border-bottom-color: var(--pear); }
  nav.steps .stepno {
    font-family: 'Roboto Mono'; font-size: 12px; border: 1px solid var(--line);
    padding: 1px 7px; color: var(--muted);
  }
  nav.steps button.done .stepno { border-color: var(--ok); color: var(--ok); }
  nav.steps .count { color: var(--pear); font-family: 'Roboto Mono'; font-size: 13px; }
  nav.steps .spacer { flex: 1; }
  .stepintro { color: var(--muted); font-size: 14px; margin: 14px 0 4px; max-width: 760px; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .toolbar input { max-width: 360px; }

  .banner { border: 1px solid var(--pear); padding: 14px 16px; margin: 14px 0; }
  .banner.ok { border-color: var(--ok); color: var(--ok); }
  .banner .hint { color: var(--muted); }

  .project { border: 1px solid var(--line); background: var(--panel); margin-bottom: 10px; }
  .project.todo { border-left: 3px solid var(--pear); }
  .project.paused { opacity: .7; }
  .project.confirmed { border-left: 3px solid var(--ok); }
  .project.skipped { opacity: .55; }
  .p-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .p-head .nr { color: var(--pear); font-family: 'Roboto Mono'; font-size: 13px; min-width: 86px; }
  .p-head .name { flex: 1; min-width: 0; }
  .p-head .name .cust { display: block; color: var(--muted); font-size: 13px; }
  .p-head .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .p-head .meta .n { color: var(--text); font-family: 'Roboto Mono'; }
  .p-body { border-top: 1px solid var(--line); padding: 14px 16px; display: none; }
  .project.open .p-body { display: block; }
  .tag { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ex { border-color: var(--danger); color: var(--danger); }
  .tag.ok { border-color: var(--ok); color: var(--ok); }
  .tag.pear { border-color: var(--pear); color: var(--pear); }

  table.contacts { width: 100%; border-collapse: collapse; }
  table.contacts td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.contacts td.mail { color: var(--muted); font-size: 13px; }
  table.contacts td.actions { text-align: right; white-space: nowrap; }
  table.contacts button { padding: 4px 10px; font-size: 13px; }

  .copyrow { margin-top: 14px; border: 1px solid var(--line); padding: 10px 12px; }
  .copyrow select { width: 100%; }
  .copyrow .cand { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .copyrow .cand input { width: 16px; height: 16px; accent-color: var(--pear); }
  .copyrow .cand .mail { color: var(--muted); font-size: 13px; }
  .copyrow .foot { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .addrow { display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 8px; margin-top: 14px; }
  @media (max-width: 640px) { .addrow { grid-template-columns: 1fr; } }
  .p-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .p-actions select { width: auto; min-width: 200px; }
  .hint { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  .p-head input.sel { width: 16px; height: 16px; accent-color: var(--pear); flex: none; cursor: pointer; }
  table.progress { width: 100%; border-collapse: collapse; margin-top: 4px; }
  table.progress th {
    text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  table.progress th:first-child { text-align: left; }
  table.progress th.sorted { color: var(--pear); }
  table.progress td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line);
    font-family: 'Roboto Mono'; font-size: 13px; }
  table.progress td:first-child { text-align: left; font-family: 'Roboto', sans-serif; }
  table.progress tr.row { cursor: pointer; }
  table.progress tr.row:hover td { background: var(--panel-2); }
  table.progress td.open-n { color: var(--pear); }
  table.progress tr.done td.open-n { color: var(--ok); }
  .sortsel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .sortsel select { width: auto; min-width: 190px; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--pear); color: #0b0b0b; padding: 10px 18px; font-weight: 500;
    display: none; z-index: 50; max-width: 90vw;
  }
  #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div id="env-banner" class="env-banner" style="display:none"></div>

<div id="login">
  <div class="login-card stack">
    <div class="wordmark">bdg<b>.</b> Project Health</div>
    <div class="langsw" id="langsw-login"></div>
    <p id="login-intro"></p>
    <div id="step-email" class="stack">
      <input id="email" type="email" placeholder="vorname@bdg.io" autocomplete="email">
      <button id="btn-send" onclick="sendCode()">Anmeldecode senden</button>
    </div>
    <div id="step-code" class="stack" style="display:none">
      <p id="code-sent"></p>
      <input id="code" inputmode="numeric" placeholder="Code aus der E-Mail" maxlength="10">
      <button id="btn-verify" onclick="verifyCode()"></button>
      <button class="quiet" id="btn-other" onclick="backToEmail()"></button>
    </div>
    <p id="login-msg" class="hint"></p>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="wordmark">bdg<b>.</b> Project Health</div>
    <div class="who"><span id="who-name"></span><span class="langsw" id="langsw-app"></span><button class="quiet" id="btn-logout" onclick="logout()"></button></div>
  </header>

  <details class="intro" id="intro">
    <summary id="intro-summary"></summary>
    <div class="body" id="intro-body"></div>
  </details>

  <div class="roundbar">
    <span class="label" id="round-label"></span>
    <div class="coverage" id="coverage" style="display:none">
      <div class="bar"><i id="cov-bar" style="width:0%"></i></div>
      <div class="legend">
        <span id="cov-l">…</span><span id="cov-r">…</span>
      </div>
    </div>
    <button id="btn-close" style="display:none" class="quiet" onclick="closeRound()"></button>
    <button id="btn-round" style="display:none" onclick="startRound()"></button>
  </div>

  <nav class="steps" id="steps"></nav>
  <p class="stepintro" id="stepintro"></p>
  <div id="round-banner"></div>
  <div class="toolbar">
    <input id="search" placeholder="Suchen … z.B.  kunde:siemens  projekt:support  nr:2026  pl:koch" oninput="render()">
    <select id="pl-filter" style="display:none; width:auto; min-width:220px" onchange="onPlFilterChange()"></select>
    <span class="sortsel"><span id="sort-label"></span>
      <select id="sort-by" onchange="sortBy = this.value; render()"></select></span>
    <button id="btn-bulk" class="ghost" style="display:none" onclick="confirmAllReady()"></button>
    <span id="bulk-admin" style="display:none; gap:8px; align-items:center;">
      <button class="quiet" id="bulk-selall" onclick="selectAllVisible()"></button>
      <select id="bulk-pl" style="width:auto;min-width:200px"></select>
      <button id="bulk-assign" onclick="assignBulk()">Zuweisen</button>
      <button id="bulk-exclude" class="danger" onclick="excludeBulk()">Ausschließen</button>
    </span>
  </div>
  <div id="list"></div>
</div>

<div id="toast"></div>
<datalist id="contact-suggest"></datalist>

<script>
/* Konfiguration kommt aus config.js im selben Ordner (siehe README).
   Live:    /config.js          -> Live-Supabase
   Staging: /staging/config.js  -> Staging-Supabase
   Diese Datei enthaelt bewusst KEINE Zugangsdaten und ist in beiden
   Umgebungen identisch — Updates lassen sich komplett ersetzen. */
const CFG = window.PROJECT_HEALTH_CONFIG || {};
if (!CFG.supabaseUrl || !CFG.anonKey) {
  document.body.innerHTML = '<div style="max-width:640px;margin:80px auto;padding:28px;'
    + 'border:1px solid #e05252;color:#f2f2f2;font-family:Roboto,sans-serif">'
    + '<h2 style="margin-top:0">Konfiguration fehlt</h2>'
    + '<p>Im selben Ordner wie diese Seite muss eine <code>config.js</code> liegen mit:</p>'
    + '<pre style="background:#1c1c1c;padding:12px;overflow:auto">window.PROJECT_HEALTH_CONFIG = {\n'
    + '  supabaseUrl: "https://DEIN-PROJEKT.supabase.co",\n  anonKey: "eyJ..."\n};</pre></div>';
  throw new Error('config.js fehlt oder unvollstaendig');
}
if (CFG.envLabel) {
  const b = document.getElementById('env-banner');
  b.textContent = CFG.envLabel; b.style.display = 'block';
  document.title = '[' + CFG.envLabel.split('·')[0].trim() + '] ' + document.title;
}
const SUPABASE_URL = CFG.supabaseUrl;
const ANON_KEY     = CFG.anonKey;


/* ===================== SPRACHEN / LANGUAGES ===================== */

let LANG = (() => {
  try { const s = localStorage.getItem('ph_lang'); if (s) return s; } catch (e) {}
  return (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
})();
function t(key, vars) {
  let s = (TEXTS[LANG] && TEXTS[LANG][key]) ?? TEXTS.de[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('ph_lang', l); } catch (e) {}
  applyStaticTexts();
  if (me) render();
}

const db = supabase.createClient(SUPABASE_URL, ANON_KEY);
let me = null, users = [], projects = [], links = [], allContacts = [];
let wave = null, waveRows = [];   // aktive Runde + wave_projects
let step = 's1';
let sortBy = 'nr';
let progSort = 'open';
const openIds = new Set();
const justEdited = new Set();   // in dieser Sitzung bearbeitet -> bleiben in Schritt 2 sichtbar
const selIds = new Set();
let visibleIds = [];
const $ = id => document.getElementById(id);

/* ---------------- Auth ---------------- */
async function sendCode() {
  const email = $('email').value.trim().toLowerCase();
  if (!email.includes('@')) return msg(t('badEmail'));
  $('btn-send').disabled = true;
  const { error } = await db.auth.signInWithOtp({ email });
  $('btn-send').disabled = false;
  if (error) return msg(t('sendFailed') + (error.message || '?'));
  $('step-email').style.display = 'none'; $('step-code').style.display = ''; msg('');
}
async function verifyCode() {
  const email = $('email').value.trim().toLowerCase();
  const token = $('code').value.trim();
  const { error } = await db.auth.verifyOtp({ email, token, type: 'email' });
  if (error) return msg(t('codeInvalid'));
  applyStaticTexts();
  await boot();
}
function backToEmail() { $('step-code').style.display='none'; $('step-email').style.display=''; }
function msg(t) { $('login-msg').textContent = t; }
async function logout() { await db.auth.signOut(); location.reload(); }

/* ---------------- Laden ---------------- */
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;
  const email = session.user.email.toLowerCase();
  // Hinweis: kein .eq('email', …) — ein "+" in der Adresse (z. B. of+pl@bdg.io)
  // wird im URL-Filter als Leerzeichen interpretiert. Deshalb clientseitig suchen;
  // die Zeilen liefert RLS ohnehin nur an freigeschaltete Nutzer.
  const { data: allUsers, error: uErr } = await db.from('users').select('*');
  const meRows = (allUsers || []).filter(u => (u.email || '').toLowerCase() === email);
  if (!meRows.length) {
    if (uErr) {
      msg(t('accessErr', {msg: uErr.message, email}));
    } else if (!allUsers || !allUsers.length) {
      msg(t('noUserList', {email}));
    } else {
      msg(t('notAllowed', {email, list: allUsers.map(u => u.email).slice(0,5).join(', ') + (allUsers.length > 5 ? ' …' : '')}));
    }
    await db.auth.signOut(); return;
  }
  me = meRows[0];
  $('login').style.display = 'none'; $('app').style.display = 'block';
  applyStaticTexts();
  try {
    const seen = localStorage.getItem('ph_intro_seen');
    $('intro').open = !seen;
    $('intro').addEventListener('toggle', () => {
      try { localStorage.setItem('ph_intro_seen', '1'); } catch (e) {}
    });
  } catch (e) { $('intro').open = true; }
  await reload();
}
const isAdmin = () => ['admin','delivery_lead'].includes(me.role);
const roundOpen = () => !!wave;                 // Runde im Status pl_review vorhanden
const canEdit  = () => isAdmin() || roundOpen(); // PLs nur waehrend laufender Runde

async function reload() {
  const [p, l, u, c, w] = await Promise.all([
    db.from('projects')
      .select('id, project_number, project_name, customer_name, customer_number, category, survey_paused, survey_paused_reason, survey_excluded, survey_excluded_reason, pl_auto_assigned, pl_user_id, pl:users!projects_pl_user_id_fkey(name)')
      .eq('status','active').eq('survey_mode','recurring').order('project_number'),
    db.from('project_contacts')
      .select('id, project_id, status, excluded_reason, contact:contacts(id, first_name, last_name, email)'),
    db.from('users').select('id, name, email').eq('active', true).order('name'),
    db.from('contacts').select('id, first_name, last_name, email').order('last_name').limit(2000),
    db.from('waves').select('id, label, status').eq('status','pl_review').order('created_at', { ascending: false }).limit(1),
  ]);
  projects = p.data || []; links = l.data || []; users = u.data || []; allContacts = c.data || [];
  wave = (w.data && w.data[0]) || null;
  waveRows = [];
  if (wave) {
    const { data } = await db.from('wave_projects')
      .select('id, project_id, review_status, skipped_reason').eq('wave_id', wave.id);
    waveRows = data || [];
  }
  $('contact-suggest').innerHTML = allContacts
    .map(k => `<option value="${esc(k.email)}">${esc(k.first_name)} ${esc(k.last_name)}</option>`).join('');
  render();
}
const linksOf = pid => links.filter(l => l.project_id === pid);
const activeLinks = pid => linksOf(pid).filter(l => l.status === 'active');
const wpOf = pid => waveRows.find(w => w.project_id === pid);
const mine = () => projects.filter(p => (isAdmin() || p.pl_user_id === me.id) && !p.survey_excluded);

/* ---------------- Navigation ----------------
   Tab- und Filterwechsel laufen ueber diese beiden Funktionen, damit die
   Mehrfachauswahl nicht in einen Bereich mitwandert, in dem die ausgewaehlten
   Projekte gar nicht mehr sichtbar sind. Die Suche raeumt bewusst NICHT auf:
   erst filtern, dann "alle sichtbaren auswaehlen" ist ein gewollter Ablauf. */
function setStep(id) {
  if (step !== id) selIds.clear();
  step = id;
  render();
}
function onPlFilterChange() {
  selIds.clear();
  render();
}

/* ---------------- Rendering ---------------- */
// Ein Projekt gilt als verwaist, wenn eine Projektleitung eingetragen ist,
// die es nicht mehr gibt. reload() laedt nur aktive Nutzer, ausgeschiedene
// fehlen also in `users`. Ohne diese Pruefung faellt so ein Projekt durchs
// Raster: beim PL taucht es nicht auf (die Person meldet sich nie wieder an)
// und unter "Ohne Projektleitung" auch nicht, weil das Feld gefuellt ist.
function isOrphan(p) {
  return !!p.pl_user_id && !users.some(u => u.id === p.pl_user_id);
}
function buckets() {
  const m = mine();
  return {
    s1: m.filter(p => p.survey_paused && (!wave || !wpOf(p.id) || wpOf(p.id).review_status === 'pending')),
    s2: m.filter(p => !p.survey_paused && (activeLinks(p.id).length === 0 || justEdited.has(p.id))),
    all: m,
    s3: m.filter(p => wpOf(p.id) && !p.survey_paused),
    unowned: isAdmin() ? projects.filter(p => (!p.pl_user_id || isOrphan(p)) && !p.survey_excluded) : [],
    excluded: isAdmin() ? projects.filter(p => p.survey_excluded) : [],
  };
}
function render() {
  const b = buckets();

  // Runden-Kopf & Fortschritt
  setHtml('round-label', wave
    ? t('roundActive', {label: esc(wave.label)})
    : t('roundNone'));
  setDisp('btn-round', isAdmin() ? '' : 'none');
  setDisp('btn-close', (isAdmin() && wave) ? '' : 'none');
  setTxt('btn-round', t('newRound'));
  setTxt('btn-close', t('closeRound'));
  if (wave && b.s3.length) {
    const done = b.s3.filter(p => wpOf(p.id).review_status !== 'pending').length;
    setDisp('coverage', '');
    setHtml('cov-l', t('covDone', {done, total: b.s3.length}));
    setHtml('cov-r', t('covOpen', {n: b.s3.length - done}));
    { const e = $('cov-bar'); if (e) e.style.width = (100 * done / b.s3.length) + '%'; }
  } else setDisp('coverage', 'none');

  // Schritte
  const pending3 = wave ? b.s3.filter(p => wpOf(p.id).review_status === 'pending').length : 0;
  const stepsDef = [
    ['s1', '1', t('step1'), b.s1.length, b.s1.length === 0],
    ['s2', '2', t('step2'), b.s2.length, b.s2.length === 0],
    ['s3', '3', t('step3'), pending3, wave && pending3 === 0 && b.s3.length > 0],
  ];
  setHtml('steps', stepsDef.map(([id, no, label, n, done]) =>
    `<button class="${step===id?'active':''} ${done?'done':''}" onclick="setStep('${id}')">
       <span class="stepno">${done?'✓':no}</span>${label}<span class="count">${n}</span></button>`).join('')
    + `<span class="spacer"></span>
       <button class="${step==='all'?'active':''}" onclick="setStep('all')">${t('tabAll')}<span class="count">${b.all.length}</span></button>
       ${isAdmin() ? `
       <button class="${step==='progress'?'active':''}" onclick="setStep('progress')">${t('tabProgress')}</button>
       <button class="${step==='unowned'?'active':''}" onclick="setStep('unowned')">${t('tabUnowned')}<span class="count">${b.unowned.length}</span></button>
       <button class="${step==='excluded'?'active':''}" onclick="setStep('excluded')">${t('tabExcluded')}<span class="count">${b.excluded.length}</span></button>` : ''}`);

  setTxt('stepintro', {
    s1: t('intro1'), s2: t('intro2'),
    s3: wave ? t('intro3') : t('intro3none'),
    all: t('introAll'), unowned: t('introUnowned'), excluded: t('introExcluded'), progress: t('introProgress'),
  }[step]);

  // Abschluss-Banner
  // Hinweis: fuer einen PL ohne laufende Runde koennen wir clientseitig nicht
  // unterscheiden, ob eine Runde abgeschlossen wurde oder noch nie eine lief —
  // reload() laedt nur waves mit status='pl_review'. Bis dahin gilt derselbe Text.
  if (!canEdit()) {
    setHtml('round-banner', `<div class="banner">${t('lockedBanner')}</div>`);
  } else if (wave && step === 's3' && b.s3.length > 0 && pending3 === 0) {
    setHtml('round-banner', `<div class="banner ok">${t('allDone', {label: esc(wave.label)})}</div>`);
  } else if (!wave && step === 's3') {
    setHtml('round-banner',
      `<div class="banner"><span class="hint">${t('noRoundHint')}</span>${isAdmin() ? t('startRoundHint') : ''}</div>`);
  } else {
    setHtml('round-banner', '');
  }

  setTxt('btn-bulk', t('confirmAllReady'));
  setDisp('btn-bulk', (wave && step === 's3') ? '' : 'none');

  // Liste
  const q = $('search').value.trim().toLowerCase();
  let list = b[step] || [];
  const openRank = p => { const w = wpOf(p.id); return w && w.review_status === 'pending' ? 0 : 1; };
  const cmpNr = (a, b2) => a.project_number.localeCompare(b2.project_number);
  const cmp = {
    nr:       cmpNr,
    customer: (a, b2) => (a.customer_name || '~').localeCompare(b2.customer_name || '~') || cmpNr(a, b2),
    pl:       (a, b2) => (a.pl?.name || '~~').localeCompare(b2.pl?.name || '~~') || cmpNr(a, b2),
    status:   (a, b2) => openRank(a) - openRank(b2) || cmpNr(a, b2),
    contacts: (a, b2) => activeLinks(a.id).length - activeLinks(b2.id).length || cmpNr(a, b2),
  }[sortBy] || cmpNr;
  list = [...list].sort(cmp);
  // Admin-Massenzuweisung
  const ba = $('bulk-admin');
  if (isAdmin()) {
    ba.style.display = 'inline-flex';
    $('bulk-pl').innerHTML = `<option value="">${t('choosePL')}</option>` +
      users.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
    setTxt('bulk-selall', t('selectAll'));
    setTxt('bulk-assign', selIds.size ? `${t('assign')} (${selIds.size})` : t('assign'));
    setTxt('bulk-exclude', selIds.size ? `${t('exclude')} (${selIds.size})` : t('exclude'));
    setDisp('bulk-exclude', step === 'excluded' ? 'none' : '');
  } else { ba.style.display = 'none'; }

  // Sortier-Auswahl
  setTxt('sort-label', t('sortBy'));
  {
    const s = $('sort-by');
    if (s) {
      const opts = [['nr', t('sortNr')], ['customer', t('sortCustomer')],
                    ...(isAdmin() ? [['pl', t('sortPL')]] : []),
                    ['status', t('sortStatus')], ['contacts', t('sortContacts')]];
      if (s.dataset.lang !== LANG || s.options.length !== opts.length) {
        s.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
        s.dataset.lang = LANG;
      }
      if ([...s.options].some(o => o.value === sortBy)) s.value = sortBy;
      else { sortBy = 'nr'; s.value = 'nr'; }
      s.style.display = step === 'progress' ? 'none' : '';
      const lab = $('sort-label'); if (lab) lab.style.display = step === 'progress' ? 'none' : '';
    }
  }

  // Admin: PL-Filter befüllen (Auswahl bleibt erhalten)
  const plSel = $('pl-filter');
  if (isAdmin()) {
    const cur = plSel.value;
    const plIds = new Set(projects.map(p => p.pl_user_id).filter(Boolean));
    plSel.innerHTML = `<option value="">${t('allPLs')}</option><option value="none">${t('noPL')}</option>` +
      users.filter(u => plIds.has(u.id))
           .map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
    plSel.value = cur;
    plSel.style.display = '';
  } else plSel.style.display = 'none';
  const plf = isAdmin() ? plSel.value : '';
  if (plf) list = list.filter(p => plf === 'none' ? !p.pl_user_id : p.pl_user_id === plf);

  // visibleIds IMMER setzen, auch beim Fortschritts-Tab. Dort sind keine
  // Projektkarten sichtbar, also ist die richtige Antwort eine leere Liste —
  // vorher blieb der Stand des vorherigen Tabs stehen und die Massenaktionen
  // liefen auf Projekten, die gar nicht auf dem Schirm waren.
  list = list.filter(p => matchQuery(q, p));
  visibleIds = step === 'progress' ? [] : list.map(p => p.id);

  setHtml('list', list.length ? list.map(card).join('') :
    `<div class="empty">${q ? t('noHits') : emptyText()}</div>`);
}

           all: t('emptyAll'), unowned: t('emptyUnowned'), excluded: t('emptyExcluded') }[step];
}

  // zentral nachhalten muss: alphabetisch geratene Zuordnung und verwaiste

    (step === 's2' || step === 'all') && nAct === 0 && !p.survey_paused ? 'todo' : '',
    done2 && justEdited.has(p.id) ? 'confirmed' : '',
    p.survey_paused ? 'paused' : '',
    wp && wp.review_status === 'confirmed' ? 'confirmed' : '',
    wp && wp.review_status === 'skipped' ? 'skipped' : '',

  return `
  <div class="${cls}" id="p-${p.id}">
    <div class="p-head" onclick="toggle('${p.id}')">
      ${isAdmin() ? `<input type="checkbox" class="sel" onclick="toggleSel('${p.id}', event)" ${selIds.has(p.id)?'checked':''}>` : ''}

      <span class="name">${esc(p.project_name||'')}<span class="cust">${esc(p.customer_name||'')}${plInfo}</span></span>
      ${plTag}${stateTag}
      <span class="meta"><span class="n">${nAct}</span> ${nAct===1?t('contacts'):t('contactsPl')}${p.survey_paused?' · '+t('paused'):''}</span>
    </div>
    <div class="p-body">
      ${p.survey_paused ? `<p class="hint">${t('pausedLine', {reason: esc(p.survey_paused_reason||'—')})}</p>` : ''}
      ${p.survey_excluded ? `<p class="hint">${t('excludedLine', {reason: esc(p.survey_excluded_reason||'—')})}</p>` : ''}
      ${ls.length ? `<table class="contacts">${ls.map(l => rowHtml(l)).join('')}</table>`
                  : `<p class="hint">${t('noContactsYet')}</p>`}
      ${canEdit() && !p.survey_excluded && copySourcesFor(p).length ? `
      <div class="copyrow">
        <select id="cp-${p.id}" onchange="showCopyContacts('${p.id}')">
          <option value="">${t('copyFrom')}</option>
          ${copySourcesFor(p).map(s => `<option value="${s.id}">${s.sameCustomer ? '★ ' : ''}${esc(s.project_number)} · ${esc(s.customer_name || s.project_name || '')} (${s.n})</option>`).join('')}
        </select>
        <div id="cplist-${p.id}"></div>
      </div>` : ''}
      ${canEdit() && !p.survey_excluded ? `<div class="addrow">
        <input id="fn-${p.id}" placeholder="${t('firstName')}">
        <input id="ln-${p.id}" placeholder="${t('lastName')}">
        <input id="em-${p.id}" type="email" list="contact-suggest" placeholder="${t('emailHint')}" onchange="prefill('${p.id}')">
        <button onclick="addContact('${p.id}')">${t('addContact')}</button>
      </div>` : ''}
      <div class="p-actions">
        ${!canEdit() ? '' : (p.survey_excluded
        /* Dauerhaft ausgeschlossen: nur zurueckholen und zuweisen. Bestaetigen,
           Aussetzen oder Kontakte pflegen ergibt hier keinen Sinn. */
        ? `${isAdmin() ? `<button class="ghost" onclick="unexclude('${p.id}')">${t('unexclude')}</button>` : ''}`
        : `
        ${p.pl_user_id ? '' : `<button onclick="claim('${p.id}')">${t('claim')}</button>`}
        ${p.survey_paused
          ? `${(wave && wp && wp.review_status === 'pending')
               ? `<button onclick="keepPaused('${wp.id}')">${t('keepPaused')}</button>` : ''}
             <button class="ghost" onclick="resume('${p.id}')">${t('resume')}</button>`
          : `<button class="quiet" onclick="pause('${p.id}')">${t('pause')}</button>`}
        ${wave && wp && wp.review_status === 'pending' && !p.survey_paused ? `
          <button onclick="confirmProject('${wp.id}','${p.id}')">${t('confirmProject')}</button>
          <button class="quiet" onclick="skipProject('${wp.id}')">${t('skipProject')}</button>` : ''}
        ${wave && wp && wp.review_status !== 'pending' ? `
          <button class="quiet" onclick="reopenProject('${wp.id}')">${t('reopen')}</button>` : ''}
        ${isAdmin() ? `<button class="danger" onclick="excludeProject('${p.id}')">${t('excludePerm')}</button>` : ''}

            ${users.filter(u=>u.id!==p.pl_user_id).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}
          </select>
          <button class="ghost" onclick="transfer('${p.id}')">${p.pl_user_id ? t('transfer') : t('assignBtn')}</button>
        `}
      </div>

/* ---------------- Aktionen ---------------- */
async function addContact(pid) {
  const fn = $(`fn-${pid}`).value.trim(), ln = $(`ln-${pid}`).value.trim(),
        em = $(`em-${pid}`).value.trim().toLowerCase();
  if (!fn || !ln || !em.includes('@')) return toast(t('tNeedFields'), true);
  const { data: c, error: e1 } = await db.from('contacts')
    .upsert({ first_name: fn, last_name: ln, email: em }, { onConflict: 'email' }).select().single();
  if (e1) return toast(t('errContact') + e1.message, true);
  const existing = linksOf(pid).find(l => l.contact.id === c.id);
  if (existing) {
    if (existing.status === 'active') return toast(t('tAlreadyLinked'), true);
    await db.from('project_contacts').update({ status: 'active', excluded_reason: null }).eq('id', existing.id);
  } else {
    const { error: e2 } = await db.from('project_contacts')
      .insert({ project_id: pid, contact_id: c.id, status: 'active', added_by: me.id });
    if (e2) return toast(t('errLink') + e2.message, true);
  }
  const wasConfirmed = wpOf(pid) && wpOf(pid).review_status === 'confirmed';
  toast(t(wasConfirmed ? 'tAddedReconfirm' : 'tAdded', {name: `${fn} ${ln}`}));
  openIds.add(pid); justEdited.add(pid); await reload();
}
async function exclude(linkId) {
  const reason = prompt(t('askExclContact'));
  if (reason === null) return;
  await db.from('project_contacts').update({ status: 'excluded', excluded_reason: reason || null }).eq('id', linkId);
  toast(t('tContactExcluded')); await reload();
}
async function setStatus(linkId, status) {

  toast(t('tContactBack')); await reload();
}
async function pause(pid) {
  const reason = prompt(t('askPause'));
  if (reason === null) return;
  await db.from('projects').update({ survey_paused: true, survey_paused_reason: reason || null }).eq('id', pid);
  const wp = wpOf(pid);
  if (wave && wp && wp.review_status === 'pending') {
    await db.from('wave_projects').update({ review_status: 'skipped', skipped_reason: 'pausiert: ' + (reason || 'ohne Angabe'), confirmed_by: me.id }).eq('id', wp.id);

async function resume(pid) {

  const wp = wpOf(pid);

/* --------- Admin: Fortschritt je Projektleitung --------- */
function renderProgress() {
  const rows = new Map();
  for (const p of projects) {
    if (p.survey_excluded) continue;
    const key = p.pl_user_id || 'none';
    if (!rows.has(key)) rows.set(key, {
      name: p.pl?.name || t('noPLShort'), id: p.pl_user_id,
      total: 0, confirmed: 0, skipped: 0, open: 0, noContacts: 0 });
    const r = rows.get(key);
    r.total++;
    const wp = wpOf(p.id);
    if (!wp) { r.open++; }
    else if (wp.review_status === 'confirmed') r.confirmed++;
    else if (wp.review_status === 'skipped') r.skipped++;
    else r.open++;
    if (!p.survey_paused && activeLinks(p.id).length === 0) r.noContacts++;
  }
  const data = [...rows.values()];
  if (!data.length) { setHtml('list', `<div class="empty">${t('emptyProgress')}</div>`); return; }

  const sorters = {
    name:       (a, b) => a.name.localeCompare(b.name),
    total:      (a, b) => b.total - a.total,
    confirmed:  (a, b) => b.confirmed - a.confirmed,
    skipped:    (a, b) => b.skipped - a.skipped,
    open:       (a, b) => b.open - a.open || b.noContacts - a.noContacts,
    noContacts: (a, b) => b.noContacts - a.noContacts,
  };
  data.sort(sorters[progSort] || sorters.open);

  const cols = [['name', t('thPL'), ''], ['total', t('thTotal'), ''],
                ['confirmed', t('thConfirmed'), ''], ['skipped', t('thSkipped'), ''],
                ['open', t('thOpen'), 'open-n'], ['noContacts', t('thNoContacts'), '']];
  setHtml('list', `<table class="progress">
    <thead><tr>${cols.map(([k, l]) =>
      `<th class="${progSort===k?'sorted':''}" onclick="progSort='${k}';render()">${l}</th>`).join('')}</tr></thead>
    <tbody>${data.map(r => `
      <tr class="row ${r.open===0?'done':''}" onclick="jumpToPL('${r.id || 'none'}')">
        ${cols.map(([k, , cls]) => `<td class="${cls}">${k==='name'
          ? esc(r.name) + (r.open===0 ? ' ✓' : '')
          : r[k]}</td>`).join('')}
      </tr>`).join('')}</tbody></table>`);
}
function jumpToPL(id) {
  setStep('all');                 // rendert einmal, damit das Dropdown existiert
  const sel = $('pl-filter');
  if (sel) { sel.value = id === 'none' ? 'none' : id; }

}

function copySourcesFor(p) {
  const own = new Set(linksOf(p.id).map(l => l.contact.id));
  return projects
    .map(o => {
      if (o.id === p.id) return null;
      const cand = activeLinks(o.id).filter(l => !own.has(l.contact.id));
      if (!cand.length) return null;
      const sameCustomer = !!(p.customer_number && o.customer_number
                              && p.customer_number === o.customer_number);
      return { id: o.id, project_number: o.project_number, project_name: o.project_name,
               customer_name: o.customer_name, n: cand.length, sameCustomer };
    })
    .filter(Boolean)
    .sort((a, b) => (b.sameCustomer - a.sameCustomer)
                 || a.project_number.localeCompare(b.project_number));
}

/* --------- Suche: Praefixe + unscharfer Abgleich ---------
   kunde:  projekt:  nr:  pl:  kategorie:  — beliebig kombinierbar,
   alles ohne Praefix sucht ueber alle Felder. Alle Teile muessen passen. */
const FIELD_MAP = {
  kunde:     p => p.customer_name || '',
  kunde2:    p => p.customer_number || '',
  projekt:   p => p.project_name || '',
  nr:        p => p.project_number || '',
  nummer:    p => p.project_number || '',
  pl:        p => p.pl?.name || '',
  kategorie: p => p.category || '',
};
function matchQuery(query, p) {
  const q = (query || '').trim();
  if (!q) return true;
  const parts = q.match(/\S+/g) || [];
  const freeWords = [];
  for (const part of parts) {
    const m = part.match(/^([a-zA-Zä-ü]+):(.*)$/);
    if (m && FIELD_MAP[m[1].toLowerCase()]) {
      const val = m[2];
      if (!val) continue;                       // "kunde:" allein ignorieren
      const key = m[1].toLowerCase();
      let hay = FIELD_MAP[key](p);
      if (key === 'kunde') hay += ' ' + (p.customer_number || '');
      if (!fuzzyMatch(val, hay)) return false;
    } else {
      freeWords.push(part);
    }
  }
  if (!freeWords.length) return true;
  const all = [p.project_number, p.project_name, p.customer_name, p.customer_number,
               p.pl?.name, p.category].filter(Boolean).join(' ');
  return fuzzyMatch(freeWords.join(' '), all);
}

/* --------- Unscharfe Suche --------- */
function norm(s) {
  return (s || '').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9 ]/g,' ');
}
function lev(a, b, max) { // Levenshtein mit Abbruchgrenze
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function fuzzyMatch(query, haystack) {
  const q = norm(query).trim();
  if (!q) return true;
  const hayWords = norm(haystack).split(/\s+/).filter(Boolean);
  const hayFull = hayWords.join(' ');
  return q.split(/\s+/).every(tok => {
    if (hayFull.includes(tok)) return true;              // Teilstring reicht
    if (/^\d+$/.test(tok)) return false;                 // Zahlen exakt: keine Toleranz
    const tol = tok.length > 7 ? 2 : tok.length > 3 ? 1 : 0;
    if (!tol) return false;
    return hayWords.some(w => {
      if (Math.abs(w.length - tok.length) <= tol && lev(tok, w, tol) <= tol) return true;
      // Tippfehler am Wortanfang (Praefix-Vergleich)
      return w.length >= tok.length && lev(tok, w.slice(0, tok.length), tol) <= tol;
    });
  });
}

/* ---------------- Utilities ---------------- */
function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastTimer;
function toast(t, err) {
  const el = $('toast'); el.textContent = t; el.className = err ? 'err' : '';
  el.style.display = 'block'; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 3500);
}
function langSwitchHtml() {
  return ['de','en'].map(l => `<button class="${LANG===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('');
}
const setTxt  = (id, v) => { const e = $(id); if (e) e.textContent = v; };
const setHtml = (id, v) => { const e = $(id); if (e) e.innerHTML = v; };
const setPh   = (id, v) => { const e = $(id); if (e) e.placeholder = v; };
const setDisp = (id, v) => { const e = $(id); if (e) e.style.display = v; };
function applyStaticTexts() {
  document.documentElement.lang = LANG;
  document.title = t('title');
  setHtml('langsw-login', langSwitchHtml());
  setHtml('langsw-app', langSwitchHtml());
  setTxt('login-intro', t('loginIntro'));
  setPh('email', t('emailPh'));
  setTxt('btn-send', t('sendCode'));
  setTxt('code-sent', t('codeSent'));
  setPh('code', t('codePh'));
  setTxt('btn-verify', t('signIn'));
  setTxt('btn-other', t('otherEmail'));
  setTxt('btn-logout', t('logout'));
  setPh('search', t('searchPh'));
  setTxt('intro-summary', t('introSummary'));
  setHtml('intro-body',
    `<p>${t('introP1')}</p><ol><li>${t('introS1')}</li><li>${t('introS2')}</li><li>${t('introS3')}</li></ol><p>${t('introP2')}</p>`);
  if (me) setTxt('who-name', me.name + (isAdmin() ? ' · ' + t('adminView') : ''));
}
applyStaticTexts();
boot();
</script>
